[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "NaNoPy"
version = "1.7.42"
authors = [
  { name="Johan Slotman", email="j.slotman@erasmusmc.nl" },
  { name="Bart Geverts", email="b.geverts@erasmusmc.nl"},
]
description = "A Graphical pySDL2 based engine for Nanobiology Erasmus MC/TU Delft"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "Numpy",
    "PySDL2",
    "pysdl2-dll",
    "Pillow>=12.3",
]

[project.optional-dependencies]
interactive = [
    "ipython"
]

[project.urls]
Homepage = "https://erasmusoic.nl"

[tool.setuptools.package-data]
"NaNoPy.demos" = ["*.ipynb", "resources/*.mp3"]

[tool.ruff]
# Ruff is code formater and linter by UV.
# Allow lines to be as long as 150. Default is 88, maximum is 320.
line-length = 150

[tool.ruff.lint]
select = ["ALL"]
# Keep the full ruleset enabled, with exceptions for established public API,
# documentation policy, and structural metrics that cannot be changed safely as
# part of a lint cleanup.
ignore = [
  "CPY001", # No project-wide copyright header or owner is defined.
  "C901",   # Existing event loops and demos are intentionally procedural.
  "COM812", # Ruff's formatter owns trailing-comma layout.
  "D",      # Public API documentation is maintained separately from linting.
  "EM",     # Inline exception messages are clearer for this small library.
  "FBT",    # Boolean parameters are part of the existing public drawing API.
  "N",      # Preserve the historical NaNoPy API and package capitalization.
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
  "SLF001", # Framework components intentionally cooperate through internals.
  "TRY003", "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"src/NaNoPy/__init__.py" = ["ANN401"]
"src/NaNoPy/demos/**" = [
  "ANN401", "ARG", "ERA001", "EXE002", "INP001", "PLW0602", "PLW0603", "S311", "T201",
]
"src/NaNoPy/demos/*.ipynb" = ["PERF401", "PLC0415", "RET503"]
"tests/**" = [
  "ANN401", "ARG", "BLE001", "INP001", "PLR2004", "PT009", "PT027", "S101", "S311", "SLF001",
]
